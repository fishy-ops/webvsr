<!DOCTYPE html><html><head><meta charset=utf-8><title>adapter</title></head><body><pre id=o>...</pre>
<script>
const post = (o) => fetch('/result', { method: 'POST', body: JSON.stringify(o) }).catch(() => {});
(async () => {
  const r = { step: 'start', gpu_present: !!navigator.gpu };
  await post(r);
  try {
    r.step = 'requestAdapter';
    const a = await Promise.race([
      navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }),
      new Promise((res) => setTimeout(() => res('TIMEOUT'), 20000)),
    ]);
    if (a === 'TIMEOUT') { r.step = 'requestAdapter TIMED OUT'; }
    else if (!a) { r.step = 'requestAdapter returned null'; }
    else {
      const i = a.info || {};
      r.step = 'ok';
      r.vendor = i.vendor; r.architecture = i.architecture;
      r.device = i.device; r.description = i.description;
      r.has_f16 = a.features.has('shader-f16');
      r.isFallback = a.isFallbackAdapter;
      const d = await a.requestDevice();
      r.device_ok = !!d;
    }
  } catch (e) { r.step = 'threw'; r.error = String(e.message || e); }
  document.getElementById('o').textContent = JSON.stringify(r, null, 1);
  await post(r);
  document.title = 'DONE';
})();
</script></body></html>
