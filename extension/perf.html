<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>WebVSR perf harness</title></head>
<body style="background:#111;color:#ddd;font-family:monospace">
<canvas id="c" width="8" height="8"></canvas>
<pre id="out">loading…</pre>
<script>
// Loads webgpu-sr.js?v=<v> dynamically (no static tag → no redeclaration on
// re-navigation). Call window.bench([heights]) via the automation tool.
const V = new URLSearchParams(location.search).get('v') || '0';
window.__ready = new Promise((res, rej) => {
  const s = document.createElement('script');
  s.src = 'webgpu-sr.js?v=' + V;
  s.onload = () => res(true); s.onerror = rej;
  document.head.appendChild(s);
});

window.bench = async (heights, withFinish) => {
  await window.__ready;
  const e = new WebGPUSR();
  if (!await e.init()) return 'init failed';
  await e.loadWeights('models/span_lite_2x.bin?v=' + V);
  const canvas = document.getElementById('c');
  const out = [];
  for (const h of heights) {
    const w = Math.round(h * 16 / 9) & ~1;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.fillStyle = '#789'; g.fillRect(0, 0, w, h);
    const frame = new VideoFrame(c, { timestamp: 0 });
    if (withFinish) e.configure(canvas, w, h, w * 2, h * 2);
    else e.configure(canvas, w, h);
    for (let i = 0; i < 8; i++) e.render(frame);
    await e.waitIdle();
    const samples = [];
    for (let i = 0; i < 30; i++) { e.render(frame); await e.waitIdle(); if (e.gpuMs > 0) samples.push(e.gpuMs); }
    frame.close();
    samples.sort((a, b) => a - b);
    const med = samples[samples.length >> 1] || 0;
    out.push(`${w}x${h}: ${med.toFixed(1)}ms (${(1000 / med).toFixed(0)}fps)`);
  }
  e.dispose();
  const r = 'f16=' + e.f16 + ' | ' + out.join(' | ');
  document.getElementById('out').textContent = r;
  return r;
};
window.__ready.then(() => { document.getElementById('out').textContent = 'ready'; });
</script>
</body></html>
